<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover : indispensable pour que les safe-area-inset servent
         a quelque chose sur iPhone a encoche. user-scalable=no + maximum-scale
         bloquent le zoom de pincement en salle, doigts moites sur l'ecran. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Journal d'entrainement pilote a la data." />

    <!-- PWA iOS : plein ecran depuis l'ecran d'accueil, sans barre Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GymTrack" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Le telephone ne doit pas transformer les charges en numeros de tel. -->
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>GymTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
